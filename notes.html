<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Notes - CollegeHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="container">
            <a href="index.html" class="logo">CollegeHub</a>
            <ul><!-- Filled by script --></ul>
        </nav>
    </header>

    <main class="container page-padding">
        <h1 class="page-title">Course Notes</h1>
        
        <!-- This is the new search bar -->
        <form id="search-form" class="review-form" style="margin-bottom: 40px; max-width: none;">
            <input type="search" id="search-input" name="q" placeholder="Search by title or subject..." style="width: 80%; display: inline-block; margin-right: 10px;">
            <button type="submit" class="cta-button" style="width: 18%;">Search</button>
        </form>
        
        <div id="notes-container"><!-- Notes will be loaded here --></div>
    </main>
    
   <script>
        // Build the dynamic navigation bar (This logic is correct and unchanged)
        const navLinksContainer = document.querySelector('header nav ul');
        fetch('/api/user-status').then(res => res.json()).then(data => {
            let navLinksHTML = `<li><a href="index.html">Home</a></li><li><a href="notes.html">Notes</a></li><li><a href="about.html">About</a></li><li><a href="feedback.html">Feedback</a></li>`;
            if (data.loggedIn) {
                navLinksHTML += `<li><a href="upload.html">Upload Notes</a></li>`;
                if (data.role === 'admin') navLinksHTML += `<li><a href="/admin">Admin</a></li>`;
                navLinksHTML += `<li><a href="/logout">Logout</a></li><li class="nav-user">Welcome, ${data.name}!</li>`;
            } else {
                navLinksHTML += `<li><a href="login.html" class="login-btn">Login / Register</a></li>`;
            }
            navLinksContainer.innerHTML = navLinksHTML;
        });

        // --- NEW SCRIPT TO HANDLE FETCHING AND SEARCHING NOTES ---
        const container = document.getElementById('notes-container');
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');

        // This function fetches notes from the server, with an optional search term
        function fetchAndRenderNotes(searchTerm = '') {
            let url = '/api/notes';
            if (searchTerm) {
                // Add the search term as a query parameter
                url += `?q=${encodeURIComponent(searchTerm)}`;
            }

            fetch(url)
                .then(response => response.json())
                .then(notes => {
                    renderNotes(notes);
                });
        }

        // This function takes an array of notes and displays them on the page
        function renderNotes(notes) {
            if (notes.length === 0) {
                container.innerHTML = '<p style="text-align: center;">No notes found for your search.</p>';
                return;
            }

            const branches = {"Computer Science": [], "Information Science": []};
            notes.forEach(note => { if (branches[note.branch]) branches[note.branch].push(note); });
            
            container.innerHTML = ''; // Clear previous results
            
            for (const branchName in branches) {
                const branchNotes = branches[branchName];
                
                // Only display the branch section if there are notes for it
                if (branchNotes.length > 0) {
                    const section = document.createElement('section');
                    section.className = 'subject-section';
                    let notesHTML = `<h2>${branchName} & Engineering</h2><div class="note-list">`;
                    
                    branchNotes.forEach(note => {
                        notesHTML += `<a href="/note-detail.html?id=${note.id}" class="note-item"><h3>${note.title}</h3><p>Subject: ${note.subject}</p></a>`;
                    });

                    notesHTML += `</div>`;
                    section.innerHTML = notesHTML;
                    container.appendChild(section);
                }
            }
        }
        
        // Listen for when the user submits the search form
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const searchTerm = searchInput.value.trim();
            fetchAndRenderNotes(searchTerm);
        });

        // Load all approved notes when the page first opens
        fetchAndRenderNotes();
    </script>
</body>
</html>
