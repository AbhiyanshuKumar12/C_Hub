<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Details - CollegeHub</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Styles for the review section */
        .rating-summary { background: #e9f5ff; border-left: 5px solid #007bff; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .rating-summary h3 { margin-top: 0; }
        .star { font-size: 1.5rem; color: #ffc107; }
        .download-section { text-align: center; background: #fff; padding: 40px; border-radius: 8px; margin-bottom: 40px; }
    </style>
</head>
<body>
    <header>
        <nav class="container">
            <a href="index.html" class="logo">CollegeHub</a>
            <ul></ul>
        </nav>
    </header>

    <main class="container page-padding">
        
        <section id="note-download-section" class="download-section">
            <h1 id="note-title">Loading note...</h1>
            <div id="download-button-container" style="margin-top: 20px;">
                </div>
        </section>

        <section class="reviews-section">
            <h2>Student Reviews</h2>
            <div id="rating-summary" class="rating-summary"></div>
            <div id="reviews-list"></div>
            <div class="review-form">
                <h3>Leave a Review</h3>
                <form id="review-form">
                    <label for="rating">Rating:</label>
                    <select id="rating" name="rating" required><option value="" disabled selected>Select a Rating</option><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select>
                    <label for="comment">Your Comment:</label>
                    <textarea id="comment" name="comment" rows="4" required></textarea>
                    <button type="submit" class="cta-button">Submit Review</button>
                </form>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const noteId = params.get('id');

            const noteTitleElement = document.getElementById('note-title');
            const downloadContainer = document.getElementById('download-button-container');
            const reviewForm = document.getElementById('review-form');
            // ... (other review variables)

            if (noteId) {
                // --- 1. Fetch Note Details and Create Download Button ---
                fetch(`/api/notes/${noteId}`)
                    .then(response => response.json())
                    .then(note => {
                        if (note && note.filepath) {
                            noteTitleElement.textContent = note.title;
                            
                            // Create a download button instead of an iframe
                            const downloadBtn = document.createElement('a');
                            downloadBtn.href = note.filepath;
                            downloadBtn.className = 'cta-button';
                            downloadBtn.textContent = 'Download Notes';
                            
                            downloadContainer.innerHTML = ''; // Clear loading message
                            downloadContainer.appendChild(downloadBtn);
                        } else {
                            noteTitleElement.textContent = 'Note not found.';
                        }
                    });
                
                // --- 2. Fetch and Display Reviews (this logic remains the same) ---
                loadReviews();
            }

            function loadReviews() {
                // ... (your existing loadReviews function is perfect and doesn't need to change)
            }

            reviewForm.addEventListener('submit', (event) => {
                 // ... (your existing review submission logic is perfect and doesn't need to change)
            });
        });
    </script>
</body>
</html>
